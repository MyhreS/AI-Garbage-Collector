name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.4.2
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      release: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aigc-*
          merge-multiple: true
      - name: Create checksum manifest
        run: |
          [ -s aigc-aarch64-apple-darwin.tar.gz ]
          [ -s aigc-x86_64-apple-darwin.tar.gz ]
          sha256sum aigc-*.tar.gz > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" aigc-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" aigc-*.tar.gz SHA256SUMS --verify-tag --generate-notes --title "AI Garbage Collector $RELEASE_TAG"
          fi
