name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf aigc-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release aigc
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: aigc-${{ matrix.target }}.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum aigc-*.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" aigc-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
