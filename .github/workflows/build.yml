name: Build platform binaries
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  check:
    name: Formatting and production lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate release version
        if: inputs.release
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "$RELEASE_TAG" = "v$version" ]
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"
      - run: cargo fmt --check
      - run: cargo clippy --locked --lib --bin aigc -- -D warnings
  binaries:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-darwin, binary: aigc}
          - {os: macos-15-intel, target: x86_64-apple-darwin, binary: aigc}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, binary: aigc}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, binary: aigc.exe}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - run: cargo clippy --locked --lib --bin aigc -- -D warnings
      - run: cargo build --release --locked --bin aigc --target ${{ matrix.target }}
      - name: Verify executable startup
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" --help
      - name: Package binary and documentation
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p package
          cp "target/$TARGET/release/$BINARY" README.md LICENSE package/
          cp -R docs package/docs
          if [ "$BINARY" = aigc.exe ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path package/* -DestinationPath aigc-$TARGET.zip"
          else
            tar -czf "aigc-$TARGET.tar.gz" -C package aigc README.md LICENSE docs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aigc-${{ matrix.target }}
          path: aigc-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7
