[package]
name = "aigc"
version = "0.4.0"
edition = "2024"
description = "A local garbage collector for development storage on macOS"
license = "MIT"
repository = "https://github.com/MyhreS/AI-Garbage-Collector"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
libc = "0.2"
walkdir = "2"
toml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
